site_name: LiveAI
site_description: LiveAI 使用指南：通过桌面悬浮窗与 ChatGPT 语音对话、分享截图并收听回复。
site_url: https://ok-oldking.github.io/LiveAI/
repo_url: https://github.com/ok-oldking/LiveAI
repo_name: ok-oldking/LiveAI
edit_uri: edit/master/docs/

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/microphone-message
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 简体中文: zh-CN/index.md
  - English: en/index.md
  - 开发与部署:
      - 开发指南 / Contributing: development/contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - stylesheets/extra.css

extra:
  alternate:
    - name: 简体中文
      link: /LiveAI/zh-CN/
      lang: zh
    - name: English
      link: /LiveAI/en/
      lang: en

exclude_docs: |
  README.md

plugins:
  - search:
      lang:
        - zh
        - en

validation:
  links:
    anchors: warn
    unrecognized_links: warn

strict: true
